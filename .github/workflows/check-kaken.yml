name: Check KAKEN grants

on:
  schedule:
    - cron: '0 2 * * 1'  # 毎週月曜 02:00 UTC（日本時間 月曜 11:00）
  workflow_dispatch:      # 手動実行も可能

permissions:
  contents: write

jobs:
  check-kaken:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check for new KAKEN grants
        run: python3 scripts/check_kaken_grants.py

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet data/known_grant_ids.json || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/known_grant_ids.json
          git commit -m "科研費の既知IDリストを更新"
          git push
